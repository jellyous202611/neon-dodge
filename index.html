<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c17"><title>NEON DODGE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c17;color:#e9f7ff;font-family:system-ui,sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;pointer-events:none;display:none}#hudtop{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:2px}#time{font-size:25px;color:white;font-variant-numeric:tabular-nums}#track{height:6px;background:#25334c;border-radius:9px;overflow:hidden;margin-top:7px}#fill{height:100%;width:100%;background:#40cfff;box-shadow:0 0 12px #40cfff}#menu{position:absolute;inset:0;background:rgba(5,8,18,.89);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}#panel{width:min(440px,100%);max-height:94vh;overflow:auto;text-align:center}h1{font-size:clamp(30px,9vw,48px);letter-spacing:4px;color:#6fe3ff;text-shadow:0 0 24px #168bc9;margin:0 0 9px}h2{margin:8px 0 12px}p{color:#a7b7cc;font-size:14px;line-height:1.6}.buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.buttons button{padding:12px 0}button{border:1px solid #347294;border-radius:12px;background:#14233b;color:#e6faff;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.28;cursor:default}button.primary{background:#12618b;border-color:#45d5ff;box-shadow:0 0 16px #13699c}button.selected{border-color:#60e3ff;background:#174b66}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.small{font-size:12px;color:#8ba6c2}#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:72px;font-weight: (()=>{'use strict';const cv=document.querySelector('#game'),ctx=cv.getContext('2d'),hud=document.querySelector('#hud'),menu=document.querySelector('#menu'),panel=document.querySelector('#panel'),count=document.querySelector('#count'),pauseBtn=document.querySelector('#pause'),stageLabel=document.querySelector('#stageLabel'),timeEl=document.querySelector('#time'),fill=document.querySelector('#fill');let W=0,H=0,dpr=1,scale=1,mode='normal',stage=1,state='menu',elapsed=0,last=0,spawn=0,shots=[],effects=[],enemies=[],player={x:0,y:0,angle:-Math.PI/2,trail:[]},stick=null,keys={},audio=null,musicTimer=0,musicStep=0,phase=-1,clearTimer=0,deathTimer=0,damageFlash=0;let saved={normal:1,hard:1,hardUnlocked:false};try{Object.assign(saved,JSON.parse(localStorage.getItem('neonDodgeSave')||'{}'))}catch(e){}const store=()=>{try{localStorage.setItem('neonDodgeSave',JSON.stringify(saved))}catch(e){}};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/390,H/750);if(state==='menu')draw()}addEventListener('resize',resize);const colors={aim:'#ff5e78',radial:'#ffd15e',laser:'#af80ff',blast:'#59ef9d',split:'#ffae55'};function beep(freq=440,dur=.09,volume=.04,type='sine'){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function music(dt){if(state!=='playing')return;musicTimer-=dt;if(musicTimer>0)return;let tier=stage>=10?3:stage>=7?2:stage>=4?1:0;musicTimer=[.36,.28,.21,.16][tier];let notes=[110,146.83,164.81,196,220,164.81,146.83,130.81],n=notes[musicStep%8];beep(n,.12,.016,'sawtooth');if(musicStep%2===0)beep(n*2,.07,.011,'triangle');musicStep++}function makeEnemies(){enemies=[];let counts=[4,6,6,8,8,10,8,10,12,12],n=counts[stage-1];for(let i=0;i<n;i++){let side=i%4,slot=Math.floor(i/4),total=Math.ceil((n-side)/4),f=(slot+1)/(total+1),type=stage===1?'aim':stage===2?'radial':stage===3?(i%2?'radial':'aim'):stage===4?'laser':stage===5?(i%2?'aim':'laser'):stage===6?'blast':stage===7?(i%2?'radial':'blast'):stage===8?(i%2?'blast':'laser'):stage===9?['aim','laser','radial'][i%3]:['aim','radial','laser','blast'][i%4];let movable=stage>=4&&(stage>=7||i%2===0),edge=side===0||side===2?W:H;enemies.push({side,f,base:f,offset:0,dir:i%2?1:-1,speed:(13+stage*5)*(mode==='hard'?1.25:1),movable,type,x:0,y:0,clock:rand(0,2),fired:0});}updateEnemies(0)}function updateEnemies(dt){for(let e of enemies){if(e.movable){e.offset+=e.dir*e.speed*dt;let limit=(e.side%2===0?W:H)*.16;if(Math.abs(e.offset)>limit){e.offset=clamp(e.offset,-limit,limit);e.dir*=-1}}let margin=17,edge=e.side%2===0?W:H,p=clamp(e.f*edge+e.offset,margin,edge-margin);if(e.side===0){e.x=p;e.y=margin}else if(e.side===1){e.x=W-margin;e.y=p}else if(e.side===2){e.x=p;e.y=H-margin}else{e.x=margin;e.y=p}}}function start(s){stage=s;elapsed=0;spawn=0;phase=-1;shots=[];effects=[];player={x:W/2,y:H/2,angle:-Math.PI/2,trail:[]};stick=null;makeEnemies();state='countdown';menu.style.display='none';hud.style.display='block';pauseBtn.style.display='block';stageLabel.textContent=(mode==='hard'?'HARD ':'')+'STAGE '+stage;count.style.display='flex';count.textContent='3';clearTimer=3.75;timeEl.textContent='30.0';fill.style.width='100%';beep(480,.11,.06);last=performance.now()}function startCountUpdate(dt){let old=Math.ceil(clearTimer-.75);clearTimer-=dt;let n=Math.ceil(clearTimer-.75);if(n!==old&&n>0){count.textContent=n;beep(480+n*70,.1,.05)}if(clearTimer<=.75&&clearTimer>0){if(count.textContent!=='GO!'){count.textContent='GO!';beep(880,.23,.07)}}if(clearTimer<=0){count.style.display='none';state='playing'}}function aimAt(e){return Math.atan2(player.y-e.y,player.x-e.x)}function bullet(x,y,a,speed,r=5,color=colors.aim,split=false){shots.push({kind:'bullet',x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r,color,age:0,split,splitAt:rand(.7,1.3),angle:a,telegraph:0})}function fire(e){let hard=mode==='hard',v=(105+stage*8)*(hard?1.18:1),a=aimAt(e);if(e.type==='aim'){for(let i=0;i<(hard&&stage>=6?2:1);i++)bullet(e.x,e.y,a+(i?rand(-.16,.16):0),v,5,colors.aim)}if(e.type==='radial'){let n=stage<5?7:10;if(hard)n+=3;for(let i=0;i<n;i++)bullet(e.x,e.y,2*Math.PI*i/n+elapsed*.4,v*.68,4,colors.radial)}if(e.type==='laser'){shots.push({kind:'laser',x:e.x,y:e.y,angle:a,age:0,warn:hard?.8:1.05,active:.4,length:Math.max(W,H)*2,color:colors.laser})}if(e.type==='blast'){let x=clamp(player.x+rand(-35,35),25,W-25),y=clamp(player.y+rand(-35,35),80,H-25);shots.push({kind:'blast',x,y,r:Math.min(W,H)*.14,age:0,warn:hard?.85:1.15,active:.36,color:colors.blast})}if(hard&&stage>=2&&(e.fired%Math.max(2,6-Math.floor(stage/2))===0)){let splitAt=stage<=3?1.2:stage<=6?.95:.75;let b={kind:'bullet',x:e.x,y:e.y,vx:Math.cos(a)*v*.65,vy:Math.sin(a)*v*.65,r:10,color:colors.split,age:0,split:true,splitAt,angle:a,telegraph:0};shots.push(b)}}function splitBullet(b){let n=stage<=3?3:stage<=6?6:stage<=9?5:8,spread=stage<=3?1.15:Math.PI*2;for(let i=0;i<n;i++){let a=n===3?b.angle+(i-1)*.45:b.angle+(i/n)*spread;bullet(b.x,b.y,a,135+stage*8,4,colors.split)}effects.push({x:b.x,y:b.y,age:0,life:.3,color:colors.split})}function collideBullet(b){return Math.hypot(player.x-b.x,player.y-b.y)<b.r+2}function pointSeg(px,py,x,y,angle){let dx=Math.cos(angle),dy=Math.sin(angle),t=Math.max(0,(px-x)*dx+(py-y)*dy);return Math.hypot(px-x-dx*t,py-y-dy*t)}function die(){if(state!=='playing')return;state='dying';deathTimer=.7;damageFlash=.18;beep(90,.32,.11,'sawtooth');for(let i=0;i<24;i++){let a=rand(0,Math.PI*2),s=rand(40,220);effects.push({kind:'particle',x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:rand(.3,.75),color:i%2?'#61d9ff':'#ff5976'})}}function clear(){if(state!=='playing')return;state='clearing';clearTimer=1.4;beep(660,.23,.08);effects.push({kind:'ring',x:player.x,y:player.y,age:0,life:1.2,color:'#6be5ff'})}function finishClear(){if(mode==='normal'){saved.normal=Math.max(saved.normal,Math.min(10,stage+1));if(stage===10)saved.hardUnlocked=true}else saved.hard=Math.max(saved.hard,Math.min(10,stage+1));store();showResult(true)}function showResult(win){state='menu';hud.style.display='none';pauseBtn.style.display='none';menu.style.display='flex';count.style.display='none';let unlocked=win&&stage===10&&mode==='normal';panel.innerHTML=`<h1>${win?'STAGE CLEAR!':'GAME OVER'}</h1><h2>${mode==='hard'?'HARD ':''}STAGE ${stage}</h2><p>${win?'30秒間、生き残った！':`生存時間：${elapsed.toFixed(1)} 秒`}</p>${unlocked?'<h2 style="color:#ffcf67">HARD MODE UNLOCKED!</h2>':''}<div class="actions">${win&&stage<10?'<button class="primary" id="next">次へ ▶</button>':''}<button id="retry">もう一度</button><button id="select">ステージ選択</button></div>`;document.querySelector('#retry').onclick=()=>start(stage);document.querySelector('#select').onclick=showMenu;if(document.querySelector('#next'))document.querySelector('#next').onclick=()=>start(stage+1)}function showMenu(){state='menu';menu.style.display='flex';hud.style.display='none';pauseBtn.style.display='none';count.style.display='none';let max=mode==='hard'?saved.hard:saved.normal;panel.innerHTML=`<h1>NEON DODGE</h1><p>30秒間、敵の攻撃を避けきれ！<br>青い三角形の中心の白い点が当たると即ゲームオーバー。</p><div class="actions"><button id="normal" class="${mode==='normal'?'selected':''}">NORMAL</button><button id="hard" ${saved.hardUnlocked?'':'disabled'} class="${mode==='hard'?'selected':''}">HARD ${saved.hardUnlocked?'':'🔒'}</button></div><h2>STAGE SELECT</h2><div class="buttons">${Array.from({length:10},(_,i)=>`<button data-stage="${i+1}" ${i+1>max?'disabled':''}>${i+1>max?'🔒':i+1}</button>`).join('')}</div><p class="small">${saved.hardUnlocked?'HARDモード解放済み':'NORMALの全10ステージをクリアするとHARD解放'}<br>画面のどこでも指を置いてスライドすると移動。離すと停止。<br>PCでは矢印キー / WASD でも移動可能。</p><div class="actions"><button id="sound">♪ サウンドを有効化</button></div>`;document.querySelector('#normal').onclick=()=>{mode='normal';showMenu()};document.querySelector('#hard').onclick=()=>{mode='hard';showMenu()};document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{beep(600,.08,.03);start(+b.dataset.stage)});document.querySelector('#sound').onclick=()=>beep(550,.15,.08)}function update(dt){if(state==='countdown'){startCountUpdate(dt);return}if(state==='dying'){deathTimer-=dt;if(deathTimer<=0)showResult(false)}if(state==='clearing'){clearTimer-=dt;if(clearTimer<=0)finishClear()}if(state==='playing'){elapsed=Math.min(30,elapsed+dt);timeEl.textContent=(30-elapsed).toFixed(1);fill.style.width=(100*(30-elapsed)/30)+'%';if(elapsed>=30){clear();return}let dx=0,dy=0;if(stick){dx=(stick.x-stick.sx)/52;dy=(stick.y-stick.sy)/52;let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}}if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}if(len>.04){player.angle=Math.atan2(dy,dx)+Math.PI/2;player.x=clamp(player.x+dx*225*scale*dt,7,W-7);player.y=clamp(player.y+dy*225*scale*dt,65,H-7);player.trail.push({x:player.x,y:player.y,age:0})}player.trail.forEach(p=>p.age+=dt);player.trail=player.trail.filter(p=>p.age<.22);updateEnemies(dt);for(let e of enemies)if(Math.hypot(player.x-e.x,player.y-e.y)<12){die();break}if(state!=='playing')return;spawn+=dt;let rate=Math.max(.29,1.55-stage*.09)*(mode==='hard'?.78:1);if(spawn>rate){spawn=0;let k=Math.floor(elapsed/rate),e=enemies[k%enemies.length];if(stage===10){let ph=Math.floor(elapsed/10);if(ph!==phase){phase=ph;beep(500+ph*150,.3,.05)}let eligible=ph===0?['aim','radial']:ph===1?['laser','blast','aim']:['aim','radial','laser','blast'];e=enemies.filter(x=>eligible.includes(x.type))[k%enemies.filter(x=>eligible.includes(x.type)).length]||e}fire(e);e.fired++;if((stage>=7||mode==='hard')&&k%3===0){let other=enemies[(k+Math.floor(enemies.length/2))%enemies.length];fire(other);other.fired++}}music(dt)}for(let b of shots){b.age+=dt;if(b.kind==='bullet'){let slowdown=state==='clearing'?.13:1;b.x+=b.vx*dt*slowdown;b.y+=b.vy*dt*slowdown;if(b.split&&b.age>=b.splitAt){b.remove=true;splitBullet(b)}if(state==='playing'&&collideBullet(b))die();if(b.x< -50||b.x>W+50||b.y< -50||b.y>H+50)b.remove=true}else if(b.kind==='laser'){if(b.age>b.warn+b.active)b.remove=true;if(state==='playing'&&b.age>=b.warn&&pointSeg(player.x,player.y,b.x,b.y,b.angle)<7)die()}else if(b.kind==='blast'){if(b.age>b.warn+b.active)b.remove=true;if(state==='playing'&&b.age>=b.warn&&Math.hypot(player.x-b.x,player.y-b.y)<b.r+2)die()}}shots=shots.filter(x=>!x.remove);for(let e of effects){e.age+=dt;if(e.kind==='particle'){e.x+=e.vx*dt;e.y+=e.vy*dt}}effects=effects.filter(e=>e.age<e.life);damageFlash=Math.max(0,damageFlash-dt)}function polygon(x,y,n,r,rotation,color){ctx.beginPath();for(let i=0;i<n;i++){let a=rotation+2*Math.PI*i/n;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fillStyle=color;ctx.shadowBlur=12;ctx.shadowColor=color;ctx.fill();ctx.shadowBlur=0}function draw(){ctx.fillStyle='#080c17';ctx.fillRect(0,0,W,H);if(state==='menu')return;ctx.save();for(let e of enemies){let c=colors[e.type];if(e.type==='aim'){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(e.x,e.y,9,0,Math.PI*2);ctx.fill()}else if(e.type==='radial')polygon(e.x,e.y,4,12,Math.PI/4,c);else if(e.type==='laser')polygon(e.x,e.y,4,10,Math.PI/4,c);else polygon(e.x,e.y,6,11,0,c);ctx.shadowBlur=0}for(let b of shots){ctx.strokeStyle=b.color;ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;if(b.kind==='bullet'){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(b.split){let warning=stage<=3?.8:stage<=6?.5:stage<=9?.4:.3;if(b.splitAt-b.age<warning){let n=stage<=3?3:stage<=6?6:stage<=9?5:8;for(let i=0;i<n;i++){let a=n===3?b.angle+(i-1)*.45:b.angle+2*Math.PI*i/n;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*40,b.y+Math.sin(a)*40);ctx.lineWidth=1.5;ctx.stroke()}}}}else if(b.kind==='laser'){ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(b.angle)*b.length,b.y+Math.sin(b.angle)*b.length);ctx.lineWidth=b.age<b.warn?2:13;ctx.setLineDash(b.age<b.warn?[7,7]:[]);ctx.globalAlpha=b.age<b.warn?.55:1;ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}else{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.globalAlpha=b.age<b.warn?.18:.65;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=2;ctx.stroke()}ctx.shadowBlur=0}for(let p of player.trail){ctx.fillStyle=`rgba(51,188,255,${.3*(1-p.age/.22)})`;ctx.beginPath();ctx.arc(p.x,p.y,5*(1-p.age/.22),0,Math.PI*2);ctx.fill()}if(state!=='dying'){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);ctx.fillStyle='#2a9de8';ctx.strokeStyle='#9beaff';ctx.lineWidth=2;ctx.shadowColor='#4bcfff';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-11,12);ctx.lineTo(0,5);ctx.lineTo(11,12);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,0,2.6,0,Math.PI*2);ctx.fill();ctx.restore()}for(let e of effects){let t=e.age/e.life;ctx.strokeStyle=e.color;ctx.fillStyle=e.color;ctx.globalAlpha=1-t;if(e.kind==='ring'){ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,t*Math.max(W,H),0,Math.PI*2);ctx.stroke()}else if(e.kind==='particle'){ctx.beginPath();ctx.arc(e.x,e.y,3*(1-t),0,Math.PI*2);ctx.fill()}else{ctx.beginPath();ctx.arc(e.x,e.y,t*30,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}if(stick&&(state==='playing'||state==='countdown')){ctx.strokeStyle='#70dfff88';ctx.lineWidth=2;ctx.beginPath();ctx.arc(stick.sx,stick.sy,45,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#6fe2ff55';ctx.beginPath();ctx.arc(clamp(stick.x,stick.sx-45,stick.sx+45),clamp(stick.y,stick.sy-45,stick.sy+45),17,0,Math.PI*2);ctx.fill()}if(damageFlash){ctx.fillStyle=`rgba(255,60,80,${damageFlash*1.6})`;ctx.fillRect(0,0,W,H)}ctx.restore()}function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}cv.addEventListener('pointerdown',e=>{if(state!=='playing'&&state!=='countdown')return;if(stick)return;cv.setPointerCapture(e.pointerId);stick={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY}});cv.addEventListener('pointermove',e=>{if(stick&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY}});function release(e){if(stick&&e.pointerId===stick.id)stick=null}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>{keys[e.key]=false});pauseBtn.onclick=()=>{if(state==='playing'){state='paused';pauseBtn.textContent='▶';count.style.display='flex';count.style.fontSize='35px';count.textContent='PAUSE'}else if(state==='paused'){state='playing';pauseBtn.textContent='Ⅱ';count.style.display='none';count.style.fontSize='72px'}};resize();showMenu();requestAnimationFrame(frame)})();
</script><noscript><div style="position:fixed;inset:0;background:#080c17;color:white;z-index:999;padding:35px 20px;text-align:center"><h1>NEON DODGE</h1><p>このプレビューではJavaScriptを実行できません。</p><p>HTMLファイルをSafariなどのブラウザで開いてください。</p></div></noscript></body></html>
